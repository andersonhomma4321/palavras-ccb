<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palavras CCB</title>
 
  <style>
    :root {
      --ccb-blue: #0b2545;
      --ccb-dark-blue: #06172e;
      --ccb-gold: #c5a059;
      --ccb-white: #f8f9fa;
      --ccb-gray: #e9ecef;
      --ccb-red: #d9534f;
    }
 
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
 
    body { 
      background-color: var(--ccb-dark-blue); 
      color: #333; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }
 
    /* Modais e Overlays */
    #login-overlay, .modal-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(6, 23, 46, 0.95); 
      display: flex;
      justify-content: center; 
      align-items: center; 
      z-index: 2000;
    }
 
    .modal-overlay { display: none; }
 
    .login-card, .admin-card {
      background: #fff; 
      padding: 2.5rem 2rem 2rem 2rem; 
      border-radius: 8px;
      border-top: 5px solid var(--ccb-gold); 
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      max-width: 500px; 
      width: 92%;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
 
    .login-card h2, .admin-card h2 { 
      color: var(--ccb-blue); 
      margin-bottom: 0.5rem; 
      font-size: 1.5rem; 
    }
    
    .login-card p, .admin-card p { 
      font-size: 0.9rem; 
      color: #666; 
      margin-bottom: 1rem; 
    }
    
    .login-card input, .admin-card input {
      width: 100%; 
      padding: 0.75rem; 
      border: 1px solid #ccc;
      border-radius: 4px; 
      margin-bottom: 0.75rem; 
      font-size: 0.95rem; 
      outline: none;
    }
 
    /* Botões principais nos cards */
    .login-card button:not(.btn-close):not(.btn-delete-item), 
    .admin-card button:not(.btn-close):not(.btn-delete-item) {
      width: 100% !important;
      padding: 0.75rem !important;
      background: var(--ccb-blue) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 4px !important;
      font-size: 1rem !important;
      cursor: pointer !important;
      font-weight: bold !important;
      transition: background 0.2s !important;
      margin-top: 0.25rem !important;
    }
    
    .login-card button:not(.btn-close):not(.btn-delete-item):hover, 
    .admin-card button:not(.btn-close):not(.btn-delete-item):hover { 
      background: var(--ccb-gold) !important; 
      color: var(--ccb-dark-blue) !important; 
    }
 
    /* Botão fechar (X) */
    button.btn-close {
      position: absolute !important;
      top: 10px !important;
      right: 12px !important;
      width: 30px !important;
      height: 30px !important;
      min-width: unset !important;
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
      border: none !important;
      font-size: 1.5rem !important;
      font-weight: bold !important;
      color: #888 !important;
      cursor: pointer !important;
      line-height: 1 !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 10 !important;
    }
    
    button.btn-close:hover { 
      color: var(--ccb-blue) !important; 
      background: transparent !important;
    }
 
    /* Lista de Gestão do Admin */
    .admin-manage-section {
      text-align: left;
      margin-top: 15px;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }
 
    .admin-manage-section h3 {
      font-size: 1rem;
      color: var(--ccb-blue);
      margin-bottom: 10px;
    }
 
    .admin-video-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px;
    }
 
    .admin-video-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }
 
    .admin-video-item:last-child {
      border-bottom: none;
    }
 
    .admin-video-item span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
    }
 
    .btn-delete-item {
      background: var(--ccb-red);
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
    }
 
    .btn-delete-item:hover {
      background: #c9302c;
    }
 
    /* App Player */
    #app-container {
      display: none; 
      width: 95%; 
      max-width: 1650px; 
      background: #fff;
      border-radius: 8px; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin: 20px 0;
    }
 
    header {
      background: var(--ccb-blue); 
      color: var(--ccb-white);
      padding: 1.2rem;
      text-align: center; 
      border-bottom: 3px solid var(--ccb-gold);
      position: relative;
    }
    
    header h1 { 
      font-weight: 600; 
      letter-spacing: 1px; 
      font-size: 1.8rem; 
    }
 
    .btn-gear {
      position: absolute; 
      right: 20px; 
      top: 50%; 
      transform: translateY(-50%);
      background: transparent; 
      border: none; 
      color: var(--ccb-gold);
      font-size: 1.5rem; 
      cursor: pointer;
      padding: 5px;
      transition: color 0.2s;
    }
    
    .btn-gear:hover { color: #fff; }
 
    .main-content { 
      display: flex; 
      flex-direction: column; 
    }
    
    @media(min-width: 900px) {
      .main-content { flex-direction: row; }
    }
 
    .player-section { 
      flex: 3; 
      padding: 1.5rem;
      background: #111; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    
    .video-container {
      position: relative; 
      width: 100%; 
      padding-bottom: 56.25%; 
      height: 0;
      background: #000; 
      border-radius: 4px; 
      overflow: hidden;
    }
 
    .video-container iframe {
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: 0;
    }
 
    .controls-extra {
      display: flex; 
      justify-content: space-between; 
      width: 100%;
      margin-top: 1rem; 
      color: #fff; 
      align-items: center;
    }
 
    .playlist-section { 
      flex: 1; 
      background: var(--ccb-white); 
      padding: 1.5rem;
      border-left: 1px solid var(--ccb-gray); 
      min-width: 300px; 
    }
    
    .search-box { margin-bottom: 1rem; }
    
    .search-box input {
      width: 100%; 
      padding: 0.6rem;
      border: 1px solid #ccc; 
      border-radius: 4px; 
      outline: none;
    }
    
    .video-list { 
      list-style: none; 
      max-height: 500px; 
      overflow-y: auto; 
    }
    
    .video-item {
      padding: 0.75rem; 
      border-bottom: 1px solid var(--ccb-gray);
      cursor: pointer;
      font-size: 0.95rem; 
      display: flex; 
      align-items: center; 
      transition: background 0.2s;
    }
    
    .video-item:hover { background: #e0e7ff; }
    
    .video-item.active { 
      background: var(--ccb-blue); 
      color: #fff; 
      font-weight: bold; 
    }
  </style>
</head>
<body>
 
  <!-- TELA DE LOGIN PRINCIPAL -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>Palavras CCB</h2>
      <p>Acesso Restrito</p>
      <input type="password" id="password-input" placeholder="Digite a senha de acesso" onkeyup="if(event.key === 'Enter') autenticar()">
      <button onclick="autenticar()">Entrar</button>
      <p id="login-error" style="color: red; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>
  </div>
 
  <!-- MODAL DE AUTENTICAÇÃO DA ENGRENAGEM -->
  <div id="admin-auth-overlay" class="modal-overlay">
    <div class="admin-card">
      <button class="btn-close" onclick="fecharModais()">&times;</button>
      <h2>Painel do Administrador</h2>
      <p>Digite a senha para gerenciar vídeos</p>
      <input type="password" id="admin-password-input" placeholder="Digite a senha mestra" onkeyup="if(event.key === 'Enter') verificarSenhaAdmin()">
      <button onclick="verificarSenhaAdmin()">Acessar</button>
      <p id="admin-auth-error" style="color: red; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>
  </div>
 
  <!-- MODAL GERENCIADOR DE VÍDEOS (ADICIONAR / EXCLUIR / CONFIGURAÇÕES) -->
  <div id="admin-form-overlay" class="modal-overlay">
    <div class="admin-card">
      <button class="btn-close" onclick="fecharModais()">&times;</button>
      <h2>Gerenciar Vídeos no GitHub</h2>
      <p>Configure e atualize o repositório</p>
      
      <input type="text" id="gh-owner" placeholder="Usuário do GitHub (ex: andersonhomma4321)">
      <input type="text" id="gh-repo" placeholder="Nome do Repositório (ex: palavras-ccb)">
      <input type="password" id="gh-token" placeholder="Personal Access Token (PAT) do GitHub">
      <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ddd;">
      
      <input type="text" id="new-video-title" placeholder="Título do Vídeo Novo">
      <input type="text" id="new-video-url" placeholder="ID ou URL do YouTube">
      
      <button id="btn-save-gh" onclick="adicionarVideoNoGitHub()">Salvar Novo Vídeo</button>

      <!-- SEÇÃO PARA ALTERAÇÃO DE SENHAS -->
      <div class="admin-manage-section">
        <h3>Alterar Senhas de Acesso</h3>
        <input type="password" id="new-user-pass" placeholder="Nova Senha de Acesso (Usuário)">
        <input type="password" id="new-admin-pass" placeholder="Nova Senha de Administrador">
        <button onclick="atualizarSenhas()" style="background: var(--ccb-gold) !important; color: #000 !important; margin-bottom: 10px;">Atualizar Senhas no Código</button>
      </div>
 
      <!-- SEÇÃO PARA EXCLUSÃO DE VÍDEOS -->
      <div class="admin-manage-section">
        <h3>Vídeos Cadastrados (Excluir)</h3>
        <ul id="admin-video-list" class="admin-video-list"></ul>
      </div>
 
      <p id="admin-msg" style="margin-top: 10px; font-size: 0.85rem; font-weight: bold;"></p>
    </div>
  </div>
 
  <!-- APLICAÇÃO DO PLAYER -->
  <div id="app-container">
    <header>
      <h1>Palavras CCB</h1>
      <button class="btn-gear" title="Gerenciar Vídeos" onclick="abrirAuthAdmin()">⚙️</button>
    </header>
 
    <div class="main-content">
      <div class="player-section">
        <div class="video-container">
          <iframe id="main-iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="controls-extra">
          <span id="current-title">Selecione um vídeo</span>
        </div>
      </div>
 
      <div class="playlist-section">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 Localizar vídeo..." onkeyup="filtrarVideos()">
        </div>
        <ul class="video-list" id="playlist"></ul>
      </div>
    </div>
  </div>
 
  <script>
    /* HASHES CRIPTOGRAFADOS DAS SENHAS (SHA-256 EM MINÚSCULAS) */
    // Senha de Acesso: "ccb2026"
    let HASH_SENHA_USUARIO = "8d3e9114d5ec25a073f139fb2305ca7b9a5449942d4a1932ea4e64f786d70543";
    
    // Senha de Administrador: "admin2026"
    let HASH_SENHA_ADMIN = "480436a5b15d263a233f269a8385d38b00693a7761eb8f1614749f7b02c8188e";

    /* LISTA DE VÍDEOS DO YOUTUBE */
    const listaVideos = [
      { title: "Palavra 2026-04-22 Proverbios 27 IrLuiz", youtubeId: "cjp_4UM7ed8" },
      { title: "Palavra 2026 04 19 Salmos 23 IrHelio", youtubeId: "XCC3hGWZ5Hw" }
    ];
 
    let currentVideoIndex = 0;
 
    const iframePlayer = document.getElementById('main-iframe');
    const playlistElement = document.getElementById('playlist');
    const titleElement = document.getElementById('current-title');

    /* FUNÇÃO DE CRIPTOGRAFIA (SHA-256) */
    async function gerarHashSHA256(texto) {
      const msgUint8 = new TextEncoder().encode(texto.trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toLowerCase();
    }
 
    async function autenticar() {
      const input = document.getElementById('password-input').value;
      const hashInput = await gerarHashSHA256(input);

      if (hashInput === HASH_SENHA_USUARIO.toLowerCase()) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        carregarPlaylist();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }
 
    function carregarPlaylist() {
      renderizarLista(listaVideos);
      if (listaVideos.length > 0) {
        tocarVideo(0);
      } else {
        titleElement.innerText = "Nenhum vídeo disponível";
        iframePlayer.src = "";
      }
    }
 
    function renderizarLista(lista) {
      playlistElement.innerHTML = '';
      lista.forEach((vid) => {
        const indexNaListaOriginal = listaVideos.findIndex(v => v.youtubeId === vid.youtubeId);
        const li = document.createElement('li');
        li.className = `video-item ${indexNaListaOriginal === currentVideoIndex ? 'active' : ''}`;
        li.innerText = vid.title;
        li.onclick = () => tocarVideo(indexNaListaOriginal);
        playlistElement.appendChild(li);
      });
    }
 
    function tocarVideo(index) {
      currentVideoIndex = index;
      const vid = listaVideos[index];
      if (!vid) return;
      
      titleElement.innerText = vid.title;
      iframePlayer.src = `https://www.youtube.com/embed/${vid.youtubeId}?enablejsapi=1&vq=hd1080&rel=0`;
      
      const termo = document.getElementById('search-input').value.toLowerCase();
      if (termo) {
        filtrarVideos();
      } else {
        renderizarLista(listaVideos);
      }
    }
 
    function filtrarVideos() {
      const termo = document.getElementById('search-input').value.toLowerCase();
      const filtrados = listaVideos.filter(vid => vid.title.toLowerCase().includes(termo));
      renderizarLista(filtrados);
    }
 
    /* MODAL E CONTROLE ADMIN */
    function abrirAuthAdmin() {
      document.getElementById('admin-password-input').value = '';
      document.getElementById('admin-auth-error').style.display = 'none';
      document.getElementById('admin-auth-overlay').style.display = 'flex';
    }
 
    function fecharModais() {
      document.getElementById('admin-auth-overlay').style.display = 'none';
      document.getElementById('admin-form-overlay').style.display = 'none';
    }
 
    async function verificarSenhaAdmin() {
      const input = document.getElementById('admin-password-input').value;
      const hashInput = await gerarHashSHA256(input);

      if (hashInput === HASH_SENHA_ADMIN.toLowerCase()) {
        document.getElementById('admin-auth-overlay').style.display = 'none';
        document.getElementById('admin-form-overlay').style.display = 'flex';
        carregarCredenciaisGitHub();
        renderizarListaAdmin();
      } else {
        document.getElementById('admin-auth-error').style.display = 'block';
      }
    }
 
    function renderizarListaAdmin() {
      const adminList = document.getElementById('admin-video-list');
      adminList.innerHTML = '';
 
      if (listaVideos.length === 0) {
        adminList.innerHTML = '<li class="admin-video-item">Nenhum vídeo cadastrado</li>';
        return;
      }
 
      listaVideos.forEach((vid, index) => {
        const li = document.createElement('li');
        li.className = 'admin-video-item';
        
        const titleSpan = document.createElement('span');
        titleSpan.innerText = vid.title;
        titleSpan.title = vid.title;
 
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete-item';
        delBtn.innerText = 'Excluir';
        delBtn.onclick = () => excluirVideoDoGitHub(index);
 
        li.appendChild(titleSpan);
        li.appendChild(delBtn);
        adminList.appendChild(li);
      });
    }
 
    function extrairYoutubeId(entrada) {
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = entrada.match(regex);
      return match ? match[1] : entrada.trim();
    }
 
    function carregarCredenciaisGitHub() {
      if (localStorage.getItem('gh_owner')) document.getElementById('gh-owner').value = localStorage.getItem('gh_owner');
      if (localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
      if (localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
    }
 
    /* SUPORTE UTF-8 PARA BASE64 (GITHUB API) */
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }
 
    function base64ToUtf8(base64) {
      const binary = atob(base64.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }
 
    /* FORMATAR ARRAY EM JAVASCRIPT STRING DE MANEIRA LIMPA */
    function formatarArrayParaCodigo(array) {
      const itensFormatados = array.map(item => `  { title: "${item.title.replace(/"/g, '\\"')}", youtubeId: "${item.youtubeId}" }`);
      return `const listaVideos = [\n${itensFormatados.join(',\n')}\n];`;
    }
 
    /* ATUALIZAR ARQUIVO NO GITHUB */
    async function salvarListaNoGitHub(novaLista, mensagemCommit, novoHashUser = null, novoHashAdmin = null) {
      const owner = document.getElementById('gh-owner').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim().replace(/\s+/g, '');
      const msg = document.getElementById('admin-msg');
 
      if (!owner || !repo || !token) {
        throw new Error('Preencha os dados do GitHub (Usuário, Repositório e PAT).');
      }
 
      localStorage.setItem('gh_owner', owner);
      localStorage.setItem('gh_repo', repo);
      localStorage.setItem('gh_token', token);
 
      msg.style.color = '#0b2545';
      msg.innerText = 'Enviando alterações para o GitHub...';
 
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
      
      const resGet = await fetch(apiUrl, {
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
 
      if (!resGet.ok) {
        if (resGet.status === 401) throw new Error('Token inválido ou revogado.');
        if (resGet.status === 404) throw new Error('Repositório ou arquivo index.html não encontrado.');
        throw new Error(`Erro na busca (${resGet.status})`);
      }
 
      const fileData = await resGet.json();
      let contentDecoded = base64ToUtf8(fileData.content);
 
      const regexLista = /const listaVideos = \[\s*[\s\S]*?\s*\];/;
 
      if (!regexLista.test(contentDecoded)) {
        throw new Error('A estrutura listaVideos não foi encontrada no arquivo.');
      }
 
      const novoCodigoArray = formatarArrayParaCodigo(novaLista);
      contentDecoded = contentDecoded.replace(regexLista, novoCodigoArray);

      // Substitui os hashes de senhas caso tenham sido alterados
      if (novoHashUser) {
        const regexUserHash = /let HASH_SENHA_USUARIO = ".*?";/;
        contentDecoded = contentDecoded.replace(regexUserHash, `let HASH_SENHA_USUARIO = "${novoHashUser}";`);
      }
      if (novoHashAdmin) {
        const regexAdminHash = /let HASH_SENHA_ADMIN = ".*?";/;
        contentDecoded = contentDecoded.replace(regexAdminHash, `let HASH_SENHA_ADMIN = "${novoHashAdmin}";`);
      }

      const contentEncoded = utf8ToBase64(contentDecoded);
 
      const resPut = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: mensagemCommit,
          content: contentEncoded,
          sha: fileData.sha
        })
      });
 
      if (!resPut.ok) {
        const errData = await resPut.json();
        throw new Error(errData.message || 'Erro ao salvar no GitHub.');
      }
    }
 
    /* ADICIONAR VÍDEO */
    async function adicionarVideoNoGitHub() {
      const title = document.getElementById('new-video-title').value.trim();
      const rawUrl = document.getElementById('new-video-url').value.trim();
      const msg = document.getElementById('admin-msg');
      const btn = document.getElementById('btn-save-gh');
 
      if (!title || !rawUrl) {
        msg.style.color = 'red';
        msg.innerText = 'Preencha o título e a URL/ID do vídeo!';
        return;
      }
 
      const youtubeId = extrairYoutubeId(rawUrl);
      btn.disabled = true;
 
      try {
        const novaLista = [...listaVideos, { title: title, youtubeId: youtubeId }];
        await salvarListaNoGitHub(novaLista, `Adicionado vídeo: ${title}`);
 
        listaVideos.push({ title: title, youtubeId: youtubeId });
        renderizarLista(listaVideos);
        renderizarListaAdmin();
 
        msg.style.color = 'green';
        msg.innerText = 'Vídeo salvo com sucesso! O GitHub Pages atualizará o site em 1-2 minutos.';
 
        document.getElementById('new-video-title').value = '';
        document.getElementById('new-video-url').value = '';
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = 'Erro: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
 
    /* EXCLUIR VÍDEO */
    async function excluirVideoDoGitHub(index) {
      const videoRemover = listaVideos[index];
      if (!videoRemover) return;
 
      if (!confirm(`Tem certeza que deseja excluir o vídeo:\n"${videoRemover.title}"?`)) {
        return;
      }
 
      const msg = document.getElementById('admin-msg');
 
      try {
        const novaLista = listaVideos.filter((_, i) => i !== index);
        await salvarListaNoGitHub(novaLista, `Removido vídeo: ${videoRemover.title}`);
 
        listaVideos.splice(index, 1);
        renderizarLista(listaVideos);
        renderizarListaAdmin();
 
        if (currentVideoIndex === index) {
          tocarVideo(0);
        } else if (currentVideoIndex > index) {
          currentVideoIndex--;
        }
 
        msg.style.color = 'green';
        msg.innerText = 'Vídeo removido com sucesso! O site atualizará em breve no GitHub Pages.';
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = 'Erro ao excluir: ' + err.message;
      }
    }

    /* ATUALIZAR SENHAS */
    async function atualizarSenhas() {
      const newPassUser = document.getElementById('new-user-pass').value.trim();
      const newPassAdmin = document.getElementById('new-admin-pass').value.trim();
      const msg = document.getElementById('admin-msg');

      if (!newPassUser && !newPassAdmin) {
        msg.style.color = 'red';
        msg.innerText = 'Preencha ao menos uma das senhas para atualizar!';
        return;
      }

      try {
        let hashUser = null;
        let hashAdmin = null;

        if (newPassUser) hashUser = await gerarHashSHA256(newPassUser);
        if (newPassAdmin) hashAdmin = await gerarHashSHA256(newPassAdmin);

        await salvarListaNoGitHub(listaVideos, 'Atualização de Senhas de Acesso', hashUser, hashAdmin);

        if (hashUser) HASH_SENHA_USUARIO = hashUser;
        if (hashAdmin) HASH_SENHA_ADMIN = hashAdmin;

        msg.style.color = 'green';
        msg.innerText = 'Senhas atualizadas e salvas no repositório GitHub com sucesso!';

        document.getElementById('new-user-pass').value = '';
        document.getElementById('new-admin-pass').value = '';
      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = 'Erro ao atualizar senhas: ' + err.message;
      }
    }
  </script>
