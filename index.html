<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palavras CCB</title>

  <style>
    :root {
      --ccb-blue: #0b2545;
      --ccb-dark-blue: #06172e;
      --ccb-gold: #c5a059;
      --ccb-white: #f8f9fa;
      --ccb-gray: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body { background-color: var(--ccb-dark-blue); color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    /* Overlay dos Modais */
    #login-overlay, .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(6, 23, 46, 0.95); display: flex;
      justify-content: center; align-items: center; z-index: 2000;
    }

    .modal-overlay { display: none; }

    .login-card, .admin-card {
      background: #fff; padding: 2.5rem 2rem 2rem 2rem; border-radius: 8px;
      border-top: 5px solid var(--ccb-gold); text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 450px; width: 90%;
      position: relative;
    }

    .login-card h2, .admin-card h2 { color: var(--ccb-blue); margin-bottom: 0.5rem; font-size: 1.5rem; }
    .login-card p, .admin-card p { font-size: 0.9rem; color: #666; margin-bottom: 1rem; }
    
    .login-card input, .admin-card input {
      width: 100%; padding: 0.75rem; border: 1px solid #ccc;
      border-radius: 4px; margin-bottom: 0.75rem; font-size: 0.95rem; outline: none;
    }

    /* Estilo aplicado APENAS aos botões principais de ação */
    .login-card button:not(.btn-close), 
    .admin-card button:not(.btn-close) {
      width: 100% !important;
      padding: 0.75rem !important;
      background: var(--ccb-blue) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 4px !important;
      font-size: 1rem !important;
      cursor: pointer !important;
      font-weight: bold !important;
      transition: 0.2s !important;
      margin-top: 0 !important;
    }
    
    .login-card button:not(.btn-close):hover, 
    .admin-card button:not(.btn-close):hover { 
      background: var(--ccb-gold) !important; 
      color: var(--ccb-dark-blue) !important; 
    }

    /* CORREÇÃO DEFINITIVA DO BOTÃO FECHAR (x) */
    button.btn-close {
      position: absolute !important;
      top: 10px !important;
      right: 12px !important;
      width: 30px !important;
      height: 30px !important;
      min-width: unset !important;
      padding: 0 !important;
      margin: 0 !important;
      background: transparent !important;
      border: none !important;
      font-size: 1.5rem !important;
      font-weight: bold !important;
      color: #888 !important;
      cursor: pointer !important;
      line-height: 1 !important;
      box-shadow: none !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 10 !important;
    }
    
    button.btn-close:hover { 
      color: var(--ccb-blue) !important; 
      background: transparent !important;
    }

    /* Estrutura do Player */
    #app-container {
      display: none; width: 95%; max-width: 1650px; background: #fff;
      border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin: 20px 0;
    }

    header {
      background: var(--ccb-blue); color: var(--ccb-white);
      padding: 1.2rem; text-align: center; border-bottom: 3px solid var(--ccb-gold);
      position: relative;
    }
    header h1 { font-weight: 600; letter-spacing: 1px; font-size: 1.8rem; }

    .btn-gear {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--ccb-gold);
      font-size: 1.5rem; cursor: pointer; padding: 5px;
    }
    .btn-gear:hover { color: #fff; }

    .main-content { display: flex; flex-direction: column; }
    @media(min-width: 900px) {
      .main-content { flex-direction: row; }
    }

    .player-section { flex: 3; padding: 1.5rem; background: #111; display: flex; flex-direction: column; align-items: center; }
    
    .video-container {
      position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
      background: #000; border-radius: 4px; overflow: hidden;
    }

    .video-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .controls-extra {
      display: flex; justify-content: space-between; width: 100%;
      margin-top: 1rem; color: #fff; align-items: center;
    }

    .playlist-section { flex: 1; background: var(--ccb-white); padding: 1.5rem; border-left: 1px solid var(--ccb-gray); min-width: 300px; }
    .search-box { margin-bottom: 1rem; }
    .search-box input {
      width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; outline: none;
    }
    .video-list { list-style: none; max-height: 500px; overflow-y: auto; }
    .video-item {
      padding: 0.75rem; border-bottom: 1px solid var(--ccb-gray);
      cursor: pointer; font-size: 0.95rem; display: flex; align-items: center; transition: 0.2s;
    }
    .video-item:hover { background: #e0e7ff; }
    .video-item.active { background: var(--ccb-blue); color: #fff; font-weight: bold; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>Palavras CCB</h2>
      <p>Acesso Restrito</p>
      <input type="password" id="password-input" placeholder="Digite a senha de acesso" onkeyup="if(event.key === 'Enter') autenticar()">
      <button onclick="autenticar()">Entrar</button>
      <p id="login-error" style="color: red; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>
  </div>

  <!-- MODAL DE AUTENTICAÇÃO DA ENGRENAGEM -->
  <div id="admin-auth-overlay" class="modal-overlay">
    <div class="admin-card">
      <button class="btn-close" onclick="fecharModais()">&times;</button>
      <h2>Painel do Administrador</h2>
      <p>Digite a senha para gerenciar vídeos</p>
      <input type="password" id="admin-password-input" placeholder="Digite a senha mestra" onkeyup="if(event.key === 'Enter') verificarSenhaAdmin()">
      <button onclick="verificarSenhaAdmin()">Acessar</button>
      <p id="admin-auth-error" style="color: red; margin-top: 10px; display: none;">Senha incorreta!</p>
    </div>
  </div>

  <!-- MODAL PARA ADICIONAR VÍDEO NO GITHUB -->
  <div id="admin-form-overlay" class="modal-overlay">
    <div class="admin-card">
      <button class="btn-close" onclick="fecharModais()">&times;</button>
      <h2>Adicionar Vídeo no GitHub</h2>
      <p>Preencha os dados abaixo para salvar no repositório</p>
      
      <input type="text" id="gh-owner" placeholder="Usuário do GitHub (ex: andersonhomma4321)">
      <input type="text" id="gh-repo" placeholder="Nome do Repositório (ex: palavras-ccb)">
      <input type="password" id="gh-token" placeholder="Personal Access Token (PAT) do GitHub">
      <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ddd;">
      
      <input type="text" id="new-video-title" placeholder="Título do Vídeo">
      <input type="text" id="new-video-url" placeholder="ID ou URL do YouTube">
      
      <button id="btn-save-gh" onclick="adicionarVideoNoGitHub()">Salvar no GitHub</button>
      <p id="admin-msg" style="margin-top: 10px; font-size: 0.85rem; font-weight: bold;"></p>
    </div>
  </div>

  <!-- APLICAÇÃO DO PLAYER -->
  <div id="app-container">
    <header>
      <h1>Palavras CCB</h1>
      <button class="btn-gear" title="Gerenciar Vídeos" onclick="abrirAuthAdmin()">⚙️</button>
    </header>

    <div class="main-content">
      <div class="player-section">
        <div class="video-container">
          <iframe id="main-iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="controls-extra">
          <span id="current-title">Selecione um vídeo</span>
        </div>
      </div>

      <div class="playlist-section">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 Localizar vídeo..." onkeyup="filtrarVideos()">
        </div>
        <ul class="video-list" id="playlist"></ul>
      </div>
    </div>
  </div>

  <script>
    const SENHA_MESTRA = "ccb081078"; 

    // LISTA DE VÍDEOS DO YOUTUBE
    const listaVideos = [
      { title: "Palavra 2026-04-22 Proverbios 27 IrLuiz", youtubeId: "cjp_4UM7ed8" },
      { title: "Palavra 2026 04 19 Salmos 23 IrHelio", youtubeId: "XCC3hGWZ5Hw" },
      { title: "Palavra 2026 04 12 Tiago 4 IrSalvador", youtubeId: "VwPzeskGiVg" }
    ];

    let currentVideoIndex = 0;

    const iframePlayer = document.getElementById('main-iframe');
    const playlistElement = document.getElementById('playlist');
    const titleElement = document.getElementById('current-title');

    function autenticar() {
      const input = document.getElementById('password-input').value;
      if (input === SENHA_MESTRA) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        carregarPlaylist();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function carregarPlaylist() {
      renderizarLista(listaVideos);
      if (listaVideos.length > 0) {
        tocarVideo(0);
      }
    }

    function renderizarLista(lista) {
      playlistElement.innerHTML = '';
      lista.forEach((vid) => {
        const indexNaListaOriginal = listaVideos.findIndex(v => v.youtubeId === vid.youtubeId);
        const li = document.createElement('li');
        li.className = `video-item ${indexNaListaOriginal === currentVideoIndex ? 'active' : ''}`;
        li.innerText = vid.title;
        li.onclick = () => tocarVideo(indexNaListaOriginal);
        playlistElement.appendChild(li);
      });
    }

    function tocarVideo(index) {
      currentVideoIndex = index;
      const vid = listaVideos[index];
      if (!vid) return;
      
      titleElement.innerText = vid.title;
      iframePlayer.src = `https://www.youtube.com/embed/${vid.youtubeId}?enablejsapi=1&vq=hd1080&rel=0`;
      
      const termo = document.getElementById('search-input').value.toLowerCase();
      if (termo) {
        filtrarVideos();
      } else {
        renderizarLista(listaVideos);
      }
    }

    function filtrarVideos() {
      const termo = document.getElementById('search-input').value.toLowerCase();
      const filtrados = listaVideos.filter(vid => vid.title.toLowerCase().includes(termo));
      renderizarLista(filtrados);
    }

    /* FUNÇÕES DA ENGRENAGEM E MODAL */
    function abrirAuthAdmin() {
      document.getElementById('admin-password-input').value = '';
      document.getElementById('admin-auth-error').style.display = 'none';
      document.getElementById('admin-auth-overlay').style.display = 'flex';
    }

    function fecharModais() {
      document.getElementById('admin-auth-overlay').style.display = 'none';
      document.getElementById('admin-form-overlay').style.display = 'none';
    }

    function verificarSenhaAdmin() {
      const input = document.getElementById('admin-password-input').value;
      if (input === SENHA_MESTRA) {
        document.getElementById('admin-auth-overlay').style.display = 'none';
        document.getElementById('admin-form-overlay').style.display = 'flex';
        carregarCredenciaisGitHub();
      } else {
        document.getElementById('admin-auth-error').style.display = 'block';
      }
    }

    function extrairYoutubeId(entrada) {
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = entrada.match(regex);
      return match ? match[1] : entrada.trim();
    }

    function carregarCredenciaisGitHub() {
      if (localStorage.getItem('gh_owner')) document.getElementById('gh-owner').value = localStorage.getItem('gh_owner');
      if (localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
      if (localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
    }

    /* INTEGRAÇÃO COM A API DO GITHUB */
    async function adicionarVideoNoGitHub() {
      const owner = document.getElementById('gh-owner').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim().replace(/\s+/g, '');
      const title = document.getElementById('new-video-title').value.trim();
      const rawUrl = document.getElementById('new-video-url').value.trim();
      const msg = document.getElementById('admin-msg');
      const btn = document.getElementById('btn-save-gh');

      if (!owner || !repo || !token || !title || !rawUrl) {
        msg.style.color = 'red';
        msg.innerText = 'Preencha todos os campos!';
        return;
      }

      localStorage.setItem('gh_owner', owner);
      localStorage.setItem('gh_repo', repo);
      localStorage.setItem('gh_token', token);

      const youtubeId = extrairYoutubeId(rawUrl);
      btn.disabled = true;
      msg.style.color = '#0b2545';
      msg.innerText = 'Enviando alterações para o GitHub...';

      try {
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
        const resGet = await fetch(apiUrl, {
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!resGet.ok) {
          if (resGet.status === 401) throw new Error('Token inválido ou revogado. Gere um novo token no GitHub.');
          if (resGet.status === 404) throw new Error('Repositório ou arquivo index.html não encontrado.');
          throw new Error(`Erro na busca (${resGet.status})`);
        }
        
        const fileData = await resGet.json();
        const contentDecoded = decodeURIComponent(escape(atob(fileData.content)));

        const novoItem = `{ title: "${title}", youtubeId: "${youtubeId}" }`;
        const regexLista = /(const listaVideos = \[\s*)([\s\S]*?)(\s*\];)/;

        if (!regexLista.test(contentDecoded)) {
          throw new Error('A lista de vídeos (listaVideos) não foi encontrada no arquivo.');
        }

        const conteudoAtualizado = contentDecoded.replace(regexLista, (match, p1, p2, p3) => {
          const virgula = p2.trim().length > 0 ? ',\n      ' : '\n      ';
          return `${p1}${p2.trim()}${virgula}${novoItem}${p3}`;
        });

        const contentEncoded = btoa(unescape(encodeURIComponent(conteudoAtualizado)));

        const resPut = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Adicionado novo vídeo: ${title}`,
            content: contentEncoded,
            sha: fileData.sha
          })
        });

        if (resPut.ok) {
          msg.style.color = 'green';
          msg.innerText = 'Vídeo salvo com sucesso! O GitHub Pages atualizará o site em 1-2 minutos.';
          
          listaVideos.push({ title: title, youtubeId: youtubeId });
          renderizarLista(listaVideos);

          document.getElementById('new-video-title').value = '';
          document.getElementById('new-video-url').value = '';
        } else {
          const errData = await resPut.json();
          throw new Error(errData.message || 'Erro ao salvar no GitHub.');
        }

      } catch (err) {
        msg.style.color = 'red';
        msg.innerText = 'Erro: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
